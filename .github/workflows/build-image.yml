name: Build GitMind CLI image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push pinned CLI
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shifuairesearch/gitmind-cli:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/shifuairesearch/gitmind-cli
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke published image without credentials or network
        run: |
          docker run --rm --network=none --entrypoint python3 \
            ghcr.io/shifuairesearch/gitmind-cli@${{ steps.build.outputs.digest }} \
            /usr/local/lib/gitmind/smoke.py
